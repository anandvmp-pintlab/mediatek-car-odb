name: Build PostmarketOS Image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3 python3-pip git bash coreutils openssl \
          kpartx e2fsprogs dosfstools parted util-linux multipath-tools \
          curl wget tar gzip xz-utils bzip2 file patch make gcc qemu-user-static

    - name: Clone pmbootstrap
      run: |
        echo "Cloning pmbootstrap..."
        git clone --depth 1 --progress https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git
        echo "Done!"

    - name: Setup pmbootstrap
      run: |
        WORK_DIR="/tmp/pmbootstrap-work"
        DEVICE="xiaomi-cactus"
        UI="none"

        sudo mkdir -p "$WORK_DIR"
        sudo chmod 777 "$WORK_DIR"
        echo '8' > "$WORK_DIR/version"

        mkdir -p "$WORK_DIR/cache_git"
        echo "Cloning pmaports (this takes a few minutes)..."
        git clone --depth 1 --progress https://gitlab.postmarketos.org/postmarketOS/pmaports.git "$WORK_DIR/cache_git/pmaports"
        echo "pmaports cloned!"

        sudo mkdir -p /root/.config

        echo '[pmbootstrap]' | sudo tee /root/.config/pmbootstrap.cfg
        echo "aports = /tmp/pmbootstrap-work/cache_git/pmaports" | sudo tee -a /root/.config/pmbootstrap.cfg
        echo "ccache_size = 5G" | sudo tee -a /root/.config/pmbootstrap.cfg
        echo "channel = master" | sudo tee -a /root/.config/pmbootstrap.cfg
        echo "device = $DEVICE" | sudo tee -a /root/.config/pmbootstrap.cfg
        echo "extra_packages = none" | sudo tee -a /root/.config/pmbootstrap.cfg
        echo "hostname = pmos" | sudo tee -a /root/.config/pmbootstrap.cfg
        echo "build_pkgs_on_install = True" | sudo tee -a /root/.config/pmbootstrap.cfg
        echo "jobs = 4" | sudo tee -a /root/.config/pmbootstrap.cfg
        echo "kernel =" | sudo tee -a /root/.config/pmbootstrap.cfg
        echo "keymap =" | sudo tee -a /root/.config/pmbootstrap.cfg
        echo "locale = en_US.UTF-8" | sudo tee -a /root/.config/pmbootstrap.cfg
        echo "mirror_alpine = http://dl-cdn.alpinelinux.org/alpine/" | sudo tee -a /root/.config/pmbootstrap.cfg
        echo "mirrors_postmarketos = http://mirror.postmarketos.org/postmarketos/" | sudo tee -a /root/.config/pmbootstrap.cfg
        echo "nonfree_firmware = True" | sudo tee -a /root/.config/pmbootstrap.cfg
        echo "nonfree_userland = False" | sudo tee -a /root/.config/pmbootstrap.cfg
        echo "ssh_keys = False" | sudo tee -a /root/.config/pmbootstrap.cfg
        echo "ssh_key_glob = ~/.ssh/id_*.pub" | sudo tee -a /root/.config/pmbootstrap.cfg
        echo "timezone = GMT" | sudo tee -a /root/.config/pmbootstrap.cfg
        echo "ui = $UI" | sudo tee -a /root/.config/pmbootstrap.cfg
        echo "ui_extras = False" | sudo tee -a /root/.config/pmbootstrap.cfg
        echo "user = user" | sudo tee -a /root/.config/pmbootstrap.cfg
        echo "work = /tmp/pmbootstrap-work" | sudo tee -a /root/.config/pmbootstrap.cfg
        echo "boot_size = 256" | sudo tee -a /root/.config/pmbootstrap.cfg
        echo "extra_space = 0" | sudo tee -a /root/.config/pmbootstrap.cfg
        echo "sudo_timer = False" | sudo tee -a /root/.config/pmbootstrap.cfg
        echo "" | sudo tee -a /root/.config/pmbootstrap.cfg
        echo '[providers]' | sudo tee -a /root/.config/pmbootstrap.cfg

        echo "=== Config file ==="
        sudo cat /root/.config/pmbootstrap.cfg

    - name: Build PostmarketOS
      run: |
        echo "Starting PostmarketOS build..."
        sudo ./pmbootstrap/pmbootstrap.py -c /root/.config/pmbootstrap.cfg -v install 2>&1 | tee build.log

    - name: Export images
      run: |
        mkdir -p output
        sudo ./pmbootstrap/pmbootstrap.py -c /root/.config/pmbootstrap.cfg export output/
        sudo chown -R $USER:$USER output/
        ls -la output/

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: pmos-xiaomi-cactus
        path: output/
        retention-days: 7
