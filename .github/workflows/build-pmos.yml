name: Build PostmarketOS Image

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Device codename'
        required: true
        default: 'xiaomi-cactus'
      ui:
        description: 'UI (none, plasma-mobile, phosh, etc.)'
        required: true
        default: 'none'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3 python3-pip git bash coreutils openssl \
          kpartx e2fsprogs dosfstools parted util-linux multipath-tools \
          curl wget tar gzip xz-utils bzip2 file patch make gcc qemu-user-static

    - name: Clone pmbootstrap
      run: |
        echo "Cloning pmbootstrap..."
        git clone --depth 1 --progress https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git
        echo "Done!"

    - name: Setup pmbootstrap
      env:
        DEVICE: ${{ github.event.inputs.device }}
        UI: ${{ github.event.inputs.ui }}
      run: |
        WORK_DIR="/tmp/pmbootstrap-work"
        sudo mkdir -p "$WORK_DIR"
        sudo chmod 777 "$WORK_DIR"
        echo '8' > "$WORK_DIR/version"

        mkdir -p "$WORK_DIR/cache_git"
        echo "Cloning pmaports (this takes a few minutes)..."
        git clone --depth 1 --progress https://gitlab.postmarketos.org/postmarketOS/pmaports.git "$WORK_DIR/cache_git/pmaports"
        echo "pmaports cloned!"

        sudo mkdir -p /root/.config
        sudo tee /root/.config/pmbootstrap.cfg > /dev/null << ENDCONFIG
[pmbootstrap]
aports = /tmp/pmbootstrap-work/cache_git/pmaports
ccache_size = 5G
channel = master
device = $DEVICE
extra_packages = none
hostname = pmos
build_pkgs_on_install = True
jobs = 4
kernel =
keymap =
locale = en_US.UTF-8
mirror_alpine = http://dl-cdn.alpinelinux.org/alpine/
mirrors_postmarketos = http://mirror.postmarketos.org/postmarketos/
nonfree_firmware = True
nonfree_userland = False
ssh_keys = False
ssh_key_glob = ~/.ssh/id_*.pub
timezone = GMT
ui = $UI
ui_extras = False
user = user
work = /tmp/pmbootstrap-work
boot_size = 256
extra_space = 0
sudo_timer = False

[providers]
ENDCONFIG

        echo "=== Config file ==="
        sudo cat /root/.config/pmbootstrap.cfg

    - name: Build PostmarketOS
      run: |
        echo "Starting PostmarketOS build..."
        sudo ./pmbootstrap/pmbootstrap.py -v install 2>&1 | tee build.log

    - name: Export images
      run: |
        mkdir -p output
        sudo ./pmbootstrap/pmbootstrap.py export output/
        sudo chown -R $USER:$USER output/
        ls -la output/

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: pmos-${{ github.event.inputs.device }}
        path: output/
        retention-days: 7
