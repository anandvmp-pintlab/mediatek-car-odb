name: Build PostmarketOS Image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3 python3-pip git bash coreutils openssl \
          kpartx e2fsprogs dosfstools parted util-linux multipath-tools \
          curl wget tar gzip xz-utils bzip2 file patch make gcc qemu-user-static

    - name: Build PostmarketOS
      run: |
        chmod +x scripts/build-pmos-ci.sh
        sudo scripts/build-pmos-ci.sh

    - name: Copy artifacts
      run: |
        mkdir -p output
        sudo cp -r /tmp/pmos-output/* output/ || true
        sudo chown -R $USER:$USER output/
        ls -la output/

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: pmos-xiaomi-cactus
        path: output/
        retention-days: 7
