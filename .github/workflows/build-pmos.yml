name: Build PostmarketOS Image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3 python3-pip git bash coreutils openssl \
          kpartx e2fsprogs dosfstools parted util-linux multipath-tools \
          curl wget tar gzip xz-utils bzip2 file patch make gcc qemu-user-static

    - name: Build PostmarketOS
      run: |
        # Everything runs as root
        sudo bash -c '
        set -ex

        WORK_DIR="/root/pmbootstrap-work"
        DEVICE="xiaomi-cactus"

        # Clone pmbootstrap
        echo "=== Cloning pmbootstrap ==="
        git clone --depth 1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git /root/pmbootstrap

        # Setup work directory
        echo "=== Setting up work directory ==="
        mkdir -p "$WORK_DIR"
        echo "8" > "$WORK_DIR/version"

        # Clone pmaports
        echo "=== Cloning pmaports ==="
        mkdir -p "$WORK_DIR/cache_git"
        git clone --depth 1 https://gitlab.postmarketos.org/postmarketOS/pmaports.git "$WORK_DIR/cache_git/pmaports"

        # Create config
        echo "=== Creating config ==="
        mkdir -p /root/.config
        cat > /root/.config/pmbootstrap.cfg << "PMCONFIG"
[pmbootstrap]
aports = /root/pmbootstrap-work/cache_git/pmaports
ccache_size = 5G
channel = master
device = xiaomi-cactus
extra_packages = none
hostname = pmos
build_pkgs_on_install = True
jobs = 4
kernel =
keymap =
locale = en_US.UTF-8
mirror_alpine = http://dl-cdn.alpinelinux.org/alpine/
mirrors_postmarketos = http://mirror.postmarketos.org/postmarketos/
nonfree_firmware = True
nonfree_userland = False
ssh_keys = False
ssh_key_glob = ~/.ssh/id_*.pub
timezone = GMT
ui = none
ui_extras = False
user = user
work = /root/pmbootstrap-work
boot_size = 256
extra_space = 0
sudo_timer = False

[providers]
PMCONFIG

        echo "=== Config file ==="
        cat /root/.config/pmbootstrap.cfg

        # Check pmbootstrap status
        echo "=== pmbootstrap status ==="
        /root/pmbootstrap/pmbootstrap.py status || true

        # Build
        echo "=== Starting build ==="
        /root/pmbootstrap/pmbootstrap.py -v install

        # Export
        echo "=== Exporting images ==="
        mkdir -p /root/output
        /root/pmbootstrap/pmbootstrap.py export /root/output/
        ls -la /root/output/
        '

    - name: Copy artifacts
      run: |
        mkdir -p output
        sudo cp -r /root/output/* output/ || true
        sudo chown -R $USER:$USER output/
        ls -la output/

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: pmos-xiaomi-cactus
        path: output/
        retention-days: 7
