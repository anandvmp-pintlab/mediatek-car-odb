name: Build PostmarketOS Image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3 python3-pip git bash coreutils openssl \
          kpartx e2fsprogs dosfstools parted util-linux multipath-tools \
          curl wget tar gzip xz-utils bzip2 file patch make gcc qemu-user-static

    - name: Create builder user
      run: |
        sudo useradd -m -s /bin/bash builder
        echo "builder ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/builder

    - name: Setup build script
      run: |
        sudo cp scripts/build-pmos-ci.sh /home/builder/
        sudo chmod +x /home/builder/build-pmos-ci.sh
        sudo chown builder:builder /home/builder/build-pmos-ci.sh

    - name: Build PostmarketOS
      run: sudo -u builder -i /home/builder/build-pmos-ci.sh

    - name: Copy artifacts
      run: |
        mkdir -p output
        sudo cp -r /home/builder/output/* output/ || true
        sudo chown -R $USER:$USER output/
        ls -la output/

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: pmos-xiaomi-cactus
        path: output/
        retention-days: 7
