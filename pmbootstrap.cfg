[pmbootstrap]
aports = /home/pmuser/.local/var/pmbootstrap/cache_git/pmaports
ccache_size = 5G
channel = master
is_default_channel = False
device = xiaomi-cactus
extra_packages = none
hostname = cactus
build_pkgs_on_install = True
jobs = 4
kernel =
keymap =
locale = en_US.UTF-8
mirror_alpine = http://dl-cdn.alpinelinux.org/alpine/
mirrors_postmarketos = http://mirror.postmarketos.org/postmarketos/
nonfree_firmware = True
nonfree_userland = False
ssh_keys = True
ssh_key_glob = ~/.ssh/id_*.pub
timezone = GMT
ui = none
ui_extras = False
user = user
work = /home/pmuser/.local/var/pmbootstrap
boot_size = 256
extra_space = 0
sudo_timer = False
qemu_redir_stdio = False
build_default_device_arch = False

[providers]
